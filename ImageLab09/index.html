<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 3 -5" radius="1.5" color="white"></a-sphere>
      <a-sphere position="0 4.5 -5" radius="1" color="white"></a-sphere>
      <a-sphere position="0 1 -5" radius="2"  color="white"></a-sphere>
      <a-cylinder position="0 5.5 -5" radius="0.8" color="black"></a-cylinder>
      <a-plane position="0 5.5 -5" width="2" height="0.5"  color="black"></a-plane>
      <a-box position="0 5 -5" rotation="0 45 0" color="orange"></a-box>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: starry; dressingAmount: 500"></a-entity>
    </a-scene>
  </body>
</html>
