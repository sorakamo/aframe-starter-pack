<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
      <a-assets>
       <img id="bg" src="bg.jpg">
       <img id="ball" src="ball.jpeg">
       <img id="umbrella" src="umbrella.webp">
      </a-assets>
      <a-sphere position="-1 0 -4" radius="1" src="#ball"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.1" height="3" color="white"></a-cylinder>
      <a-sphere position="0.9 1.5 -3" radius="1.4" theta-length="70" src="#umbrella" side="double"></a-sphere>
      <a-sky src="#bg"></a-sky>
    </a-scene>
  </body>
</html>
